services:
  - type: web
    name: spuder-ai
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SPUDER_VOICE
        value: pt-BR-AntonioNeural
      - key: PORT
        value: 10000
